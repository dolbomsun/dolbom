<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d366b">
<meta name="description" content="태양치과 방문진료 통합관리 — 환자·일정·장비·의료진·제도·수가">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="돌봄">
<title>돌봄 · 방문치과 통합관리 플랫폼</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --surface-2:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --critical:#d03b3b;
  --brand:#0d366b; --brand-soft:#cde2fb;
  --r:14px; --shadow:0 1px 2px rgba(11,11,11,.05), 0 8px 24px -12px rgba(11,11,11,.14);
  --nav-w:236px; --top-h:58px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --surface-2:#211f1e;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --brand:#86b6ef; --brand-soft:#184f95;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.02em}

.topbar{position:sticky;top:0;z-index:60;height:var(--top-h);display:flex;align-items:center;gap:12px;
  padding:0 16px;background:color-mix(in srgb,var(--surface-1) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.03em;font-size:15.5px;white-space:nowrap}
.logo .mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--series-1),var(--brand));
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;letter-spacing:-.04em}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.seg{display:flex;background:var(--plane);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 2px rgba(11,11,11,.08)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface-2);font-size:14px;flex:0 0 auto}
.icon-btn:hover{background:var(--plane)}
.who{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--ink-2);
  padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.net{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 7px}
.net.off{background:var(--critical)}
.net.demo{background:var(--warn)}

.shell{display:flex;min-height:calc(100vh - var(--top-h))}
.sidenav{width:var(--nav-w);flex:0 0 var(--nav-w);padding:14px 10px;border-right:1px solid var(--border);
  background:var(--surface-1);position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));overflow-y:auto}
.navgroup{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:12px 12px 6px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;
  font-size:13.5px;font-weight:550;color:var(--ink-2);text-align:left}
.navitem:hover{background:var(--plane)}
.navitem[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
:root[data-theme="dark"] .navitem[aria-current="page"]{color:#fff}
.navitem .ic{width:18px;text-align:center;font-size:14px}
.navitem .badge{margin-left:auto;background:var(--critical);color:#fff;font-size:10px;font-weight:700;
  border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
main{flex:1;min-width:0;padding:22px clamp(14px,3vw,32px) 96px}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:clamp(19px,2.4vw,24px)}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.bottomnav{display:none}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:29px;font-weight:730;letter-spacing:-.035em;margin-top:6px;line-height:1.1}
.kpi .val span{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.kpi .delta{font-size:11.5px;font-weight:650;margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2.5px 9px;
  border-radius:999px;border:1px solid var(--border);background:var(--plane);color:var(--ink-2);white-space:nowrap}
.tag.good{color:#006300;background:#e8f6e8;border-color:transparent}
.tag.warn{color:#7a5200;background:#fdf2d8;border-color:transparent}
.tag.crit{color:#8f1f1f;background:#fbe6e6;border-color:transparent}
.tag.info{color:#184f95;background:#e3eefc;border-color:transparent}
:root[data-theme="dark"] .tag.good{color:#7fe07f;background:#123012}
:root[data-theme="dark"] .tag.warn{color:#f5cf7a;background:#3a2e10}
:root[data-theme="dark"] .tag.crit{color:#f2a1a1;background:#3a1717}
:root[data-theme="dark"] .tag.info{color:#a8cbf5;background:#132c4d}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;
  padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--plane)}
tbody tr[data-click]{cursor:pointer}
.num{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:10px;
  font-size:13px;font-weight:650;border:1px solid var(--border);background:var(--surface-2)}
.btn:hover{background:var(--plane)}
.btn.primary{background:var(--series-1);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#8f1f1f}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12px;font-weight:650;color:var(--ink-2)}
.field input,.field select,.field textarea{padding:9px 11px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--series-1);outline-offset:-1px}
.field .hint{font-size:11.5px;color:var(--muted)}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.searchbar input{flex:1;min-width:180px;padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-1)}
.searchbar select{padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface-1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-1);
  font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:transparent}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#fff}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--grid)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-20px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--series-1);box-shadow:0 0 0 2px var(--surface-1)}
.tl-item.muted::before{background:var(--axis)}
.tl-date{font-size:11.5px;color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums}
.tl-title{font-weight:650;font-size:13.5px;margin-top:1px}
.tl-body{font-size:12.5px;color:var(--ink-2);margin-top:3px}

.checklist{display:flex;flex-direction:column;gap:2px}
.checkitem{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px}
.checkitem:hover{background:var(--plane)}
.checkitem input{margin-top:3px;width:16px;height:16px;accent-color:var(--series-1);flex:0 0 16px}
.checkitem .t{display:block;font-size:13px;font-weight:600}
.checkitem .d{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.5}
.checkitem.done .t{color:var(--muted);text-decoration:line-through}
.meter{height:6px;border-radius:999px;background:var(--grid);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--series-1)}

.scrim{position:fixed;inset:0;background:rgba(11,11,11,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:90;background:var(--surface-1);
  border-left:1px solid var(--border);transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.drawer-body{overflow-y:auto;padding:18px;flex:1}
@media (max-width:640px){.drawer{width:100%;top:auto;height:92vh;border-radius:18px 18px 0 0;border-left:none;
  border-top:1px solid var(--border);transform:translateY(110%)}.drawer.open{transform:none}}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-d{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:7px 6px;min-height:96px}
.cal-d .n{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-d.today{border-color:var(--series-1);box-shadow:inset 0 0 0 1px var(--series-1)}
.ev{margin-top:4px;padding:4px 6px;border-radius:7px;font-size:10.5px;font-weight:650;line-height:1.3;cursor:pointer;
  background:var(--brand-soft);color:var(--brand);border-left:2px solid var(--series-1)}
:root[data-theme="dark"] .ev{color:#dce9fb}
.ev.care{background:#e0f5ec;color:#0a6b4a;border-left-color:var(--series-3)}
.ev.eval{background:#fdeae1;color:#8a3a17;border-left-color:var(--series-2)}
:root[data-theme="dark"] .ev.care{background:#0f2f24;color:#8fe3c4}
:root[data-theme="dark"] .ev.eval{background:#3a2015;color:#f5b391}
@media (max-width:760px){.cal{grid-template-columns:1fr;gap:6px}.cal-h{display:none}
  .cal-d{min-height:0;display:flex;gap:10px;align-items:flex-start}.cal-d .n{flex:0 0 52px;padding-top:2px}.cal-d .evs{flex:1}}

.chart{width:100%;display:block}
.tt{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--surface-1);padding:6px 10px;
  border-radius:8px;font-size:11.5px;font-weight:600;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:var(--shadow)}
.tt.on{opacity:1}
.notice{display:block;padding:11px 13px;border-radius:11px;background:#fdf2d8;color:#7a5200;
  font-size:12.5px;font-weight:550;line-height:1.6;word-break:keep-all}
.notice code{background:rgba(11,11,11,.07);padding:1px 5px;border-radius:5px;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
:root[data-theme="dark"] .notice code{background:rgba(255,255,255,.12)}
:root[data-theme="dark"] .notice{background:#332a12;color:#f0d18e}
.notice.info{background:#e3eefc;color:#184f95}
:root[data-theme="dark"] .notice.info{background:#12253f;color:#a8cbf5}
.notice.ok{background:#e8f6e8;color:#006300}
:root[data-theme="dark"] .notice.ok{background:#123012;color:#7fe07f}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600;font-size:12.5px}
.kv dd{margin:0;font-weight:550}
.stack{display:flex;flex-direction:column;gap:14px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.sm{font-size:12px}
hr.sep{border:none;border-top:1px solid var(--grid);margin:14px 0}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13px}

.front-hero{border-radius:20px;padding:clamp(22px,4vw,40px);color:#fff;
  background:linear-gradient(135deg,#184f95,#2a78d6 55%,#1baf7a);box-shadow:var(--shadow)}
.front-hero h2{font-size:clamp(21px,3.6vw,30px);line-height:1.3;letter-spacing:-.03em}
.front-hero p{margin:10px 0 0;font-size:14px;opacity:.92;max-width:52ch}
.front-hero .btn{background:#fff;color:#184f95;border:none;margin-top:18px;font-weight:700}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:12px;font-weight:750}
:root[data-theme="dark"] .step .n{color:#fff}
.step{display:flex;gap:12px;align-items:flex-start}
.track{display:flex;margin:6px 0 0;overflow-x:auto}
.track-s{flex:1;min-width:82px;text-align:center;position:relative;padding-top:22px;font-size:11.5px;font-weight:600;color:var(--muted)}
.track-s::before{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--grid)}
.track-s:last-child::before{display:none}
.track-s::after{content:"";position:absolute;top:1px;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;
  background:var(--grid);border:2px solid var(--surface-1)}
.track-s.done::after{background:var(--series-1)}
.track-s.done{color:var(--ink)}
.track-s.done::before{background:var(--series-1)}

/* 로그인 */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--plane)}
.auth-card{width:min(420px,100%);background:var(--surface-1);border:1px solid var(--border);
  border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120%);z-index:300;background:var(--ink);
  color:var(--surface-1);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:650;
  transition:transform .25s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

@media (max-width:900px){
  .sidenav{display:none}
  main{padding-bottom:86px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:color-mix(in srgb,var(--surface-1) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;
    font-size:10px;font-weight:650;color:var(--muted);border-radius:10px}
  .bottomnav button .ic{font-size:17px}
  .bottomnav button[aria-current="page"]{color:var(--series-1)}
}
@media (max-width:620px){
  .logo small{display:none}
  .logo{font-size:14px;gap:7px}.logo .mark{width:24px;height:24px}
  .topbar{padding:0 10px;gap:8px}
  .seg button{padding:5px 9px;font-size:11.5px}
  .icon-btn{width:31px;height:31px;flex:0 0 31px}
  .who{display:none}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 13px}.kpi .val{font-size:22px}.kpi .lbl{font-size:11.5px}.kpi .delta{font-size:10.5px}
}
@media (max-width:360px){.logo span:last-child{display:none}}
@media print{.topbar,.sidenav,.bottomnav,.btn{display:none!important}main{padding:0}}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><strong id="drawer-title" style="flex:1;font-size:15px">상세</strong>
    <button class="icon-btn" onclick="closeDrawer()" aria-label="닫기">✕</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="tt" id="tt"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   ★★★ 설정 — 여기 두 줄만 채우면 실시간 공유 모드로 전환됩니다 ★★★
   Supabase 대시보드 → Project Settings → API 에서 복사
   비워 두면 "데모 모드"(내 기기에만 저장)로 동작합니다.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL:      '',   // 예: https://abcdefgh.supabase.co
  SUPABASE_ANON_KEY: '',   // 예: eyJhbGciOi...  (anon public key — 공개되어도 안전, RLS로 보호)
  CLINIC_NAME:       '태양치과'
};
/* =================================================================== */

const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
let sb = null, session = null, me = { name:'데모 사용자', app_role:'admin' };
let online = navigator.onLine;

const KRW = n => (n||0).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2,10);
const todayISO = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const age = y => y ? (new Date().getFullYear() - y) : null;  // 만 나이

/* 안전한 로컬 저장 (샌드박스/시크릿 모드에서도 에러 없이 동작) */
const mem = {};
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ mem[k] = v; } }
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}

/* =====================================================================

const SNAP = 'dolbom.snapshot';
const QUEUE = 'dolbom.queue';

async function loadAll(){
  if (!LIVE){
    const cached = LS.get(SNAP);
    Object.assign(S, cached && cached.patients ? cached : demoSeed());
    return;
  }
  try {
    const res = await Promise.all(TABLES.map(t => sb.from(t).select('*')));
    res.forEach((r,i) => { if (!r.error) S[TABLES[i]] = r.data || []; });
    S.rules.sort((a,b)=>(a.sort||0)-(b.sort||0));
    S.fee_master.sort((a,b)=>(a.sort||0)-(b.sort||0));
    LS.set(SNAP, S);
    setNet('on');
  } catch (e) {
    const cached = LS.get(SNAP);
    if (cached && cached.patients) { Object.assign(S, cached); toast('오프라인 — 마지막 저장분을 표시합니다'); }
    setNet('off');
  }
}

/* 저장: 온라인이면 즉시 반영, 오프라인이면 대기열에 넣고 화면은 먼저 갱신 */
async function save(table, row){
  const isNew = !row.id;
  if (isNew) row.id = uid();
  const local = S[table].findIndex(x => x.id === row.id);
  if (local >= 0) S[table][local] = { ...S[table][local], ...row }; else S[table].unshift(row);

  if (!LIVE){ LS.set(SNAP, S); render(); return row; }

  if (!online){ queuePush({op:'upsert', table, row}); LS.set(SNAP, S); render(); toast('오프라인 저장 — 연결되면 자동 전송'); return row; }
  const payload = { ...row };
  if (isNew && String(payload.id).startsWith('x')) delete payload.id;
  const { data, error } = await sb.from(table).upsert(payload).select().single();
  if (error){ toast('저장 실패: ' + error.message); return null; }
  const j = S[table].findIndex(x => x.id === row.id);
  if (j >= 0) S[table][j] = data; else S[table].unshift(data);
  LS.set(SNAP, S); render(); toast('저장되었습니다');
  return data;
}

async function removeRow(table, id){
  S[table] = S[table].filter(x => x.id !== id);
  if (!LIVE){ LS.set(SNAP, S); render(); return; }
  if (!online){ queuePush({op:'delete', table, id}); LS.set(SNAP, S); render(); return; }
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) toast('삭제 실패: ' + error.message); else toast('삭제되었습니다');
  LS.set(SNAP, S); render();
}

function queuePush(item){ const q = LS.get(QUEUE) || []; q.push(item); LS.set(QUEUE, q); updateNetChip(); }
async function flushQueue(){
  if (!LIVE || !online) return;
  const q = LS.get(QUEUE) || [];
  if (!q.length) return;
  const rest = [];
  for (const it of q){
    try {
      if (it.op === 'upsert'){
        const p = { ...it.row }; if (String(p.id).startsWith('x')) delete p.id;
        const { error } = await sb.from(it.table).upsert(p); if (error) throw error;
      } else { const { error } = await sb.from(it.table).delete().eq('id', it.id); if (error) throw error; }
    } catch(e){ rest.push(it); }
  }
  LS.set(QUEUE, rest);
  if (rest.length < q.length){ toast(`대기 중이던 ${q.length - rest.length}건을 전송했습니다`); await loadAll(); render(); }
  updateNetChip();
}

  const w=520, h=190, pad={l:8,r:8,t:22,b:26};

  const iw = w-pad.l-pad.r, bw = Math.min(46, iw/data.length - 12);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" style="height:auto;max-height:220px">

    ${data.map((d,i)=>{const cx=pad.l+iw*(i+.5)/data.length, bh=(h-pad.t-pad.b)*(d.v/max), y=h-pad.b-bh;
      return `<g onmousemove="ttMove(event)" onmouseenter="ttShow(event,'<b>${esc(d.k)}</b> · ${d.v}건')" onmouseleave="ttHide()">
        <rect x="${cx-bw/2-6}" y="${pad.t-6}" width="${bw+12}" height="${h-pad.t-pad.b+12}" fill="transparent"/>

function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function fmtDT(s){ if(!s) return '-'; return String(s).replace('T',' ').slice(5,16); }
function lastWeeks(n){
  const out = []; const T = todayISO();
  for (let i = n-1; i >= 0; i--){
    const end = addDays(T, -7*i), start = addDays(end, -6);
    out.push({ k: `${+start.slice(5,7)}/${+start.slice(8,10)}주`,
               v: S.visits.filter(v => v.visit_date >= start && v.visit_date <= end && v.status !== '취소').length });
  }
  return out;
}
function routeHint(regions){
  if (regions.length < 2) return '';
  const [a,b] = regions;
  return `<div class="notice info" style="margin-top:10px">💡 ${a.k} ${a.v}명 · ${b.k} ${b.v}명은 같은 날 1개 루트로 묶으면 이동시간을 크게 줄일 수 있습니다.</div>`;
}
function alerts(){
  const out = [];
  const T = todayISO();
  S.patients.forEach(p => {
    if (!p.risks?.length) return;
    const up = S.visits.find(v => v.patient_id === p.id && v.status === '예약' && v.visit_date >= T);
    if (up) out.push(['crit', `${p.name} · ${p.risks[0]}`, `${up.visit_date} ${(up.visit_time||'').slice(0,5)} ${up.type} 예정 — 시술 전 확인 필요`, 'patients']);
  });
  S.equipment.filter(e => e.next_check && e.next_check <= addDays(T,5))
    .forEach(e => out.push(['warn', `장비 점검 기한 임박 · ${e.name}`, `${e.serial} — ${e.next_check}까지 점검 완료 필요`, 'equip']));
  S.visits.filter(v => v.status === '미배정' && v.visit_date >= T)
    .forEach(v => out.push(['crit', `담당 미배정 방문`, `${patN(v.patient_id)} · ${v.visit_date} ${v.type}`, 'schedule']));
  S.contents.filter(c => !c.consent && c.patient_id)
    .forEach(c => out.push(['warn', '콘텐츠 동의 미취득', `${esc(c.title)} — 서면 동의 없이 게시 불가`, 'content']));
  if (S.rules.some(r => r.status === '가이드라인'))
    out.push(['warn','수가 고시 미확정','방문치과 수가는 1차 가이드라인 단계 — 청구는 시뮬레이션만 운용','policy']);
  if (!out.length) return '<div class="empty">확인이 필요한 항목이 없습니다</div>';
  return out.slice(0,6).map(([tone,t,d,page]) => {
    const c = tone === 'crit' ? 'var(--critical)' : 'var(--warn)';
    return `<button style="display:flex;gap:10px;text-align:left;width:100%;padding:9px 10px;border-radius:10px;align-items:flex-start"
      onmouseover="this.style.background='var(--plane)'" onmouseout="this.style.background='none'" onclick="go('${page}')">
      <span class="dot" style="background:${c};margin-top:6px"></span>
      <span><span style="display:block;font-size:13px;font-weight:650">${t}</span>
      <span style="display:block;font-size:11.5px;color:var(--muted);margin-top:1px">${d}</span></span></button>`;
  }).join('');
}

async function savePatient(id){
  const name = val('pf-name'); if (!name) return toast('성함은 필수입니다');
  const split = s => s ? s.split(',').map(x=>x.trim()).filter(Boolean) : [];
  const row = { name, birth_year: +val('pf-birth') || null, sex: val('pf-sex') || null, tel: val('pf-tel'),
    guardian_name: val('pf-gn'), guardian_rel: val('pf-gr'), guardian_tel: val('pf-gt'),
    region: val('pf-region'), place: val('pf-place'), address: val('pf-addr'),
    ltc_grade: val('pf-ltc') === '선택' ? null : val('pf-ltc'),
    mobility: val('pf-mob') === '선택' ? null : val('pf-mob'),
    doctor_id: val('pf-doc') || null, status: val('pf-status'),
    diseases: split(val('pf-dz')), meds: split(val('pf-meds')), risks: split(val('pf-risk')),
    ohat: val('pf-ohat') === '' ? null : Math.max(0, Math.min(16, +val('pf-ohat'))) };
  if (id) row.id = id;
  else if (!LIVE) row.code = 'P' + String(S.patients.length + 1).padStart(3,'0');
  const saved = await save('patients', row);
  closeDrawer(); if (saved) showPatient(saved.id);
}


/* ---------- 일정 · 방문 배정 ---------- */
let weekStart = null;
function mondayOf(iso){ const d = new Date(iso+'T00:00:00Z'); const w = (d.getUTCDay()+6)%7; return addDays(iso, -w); }
V.schedule = () => {
  const T = todayISO();
  if (!weekStart) weekStart = mondayOf(T);
  const days = Array.from({length:7}, (_,i)=>addDays(weekStart,i));
  const names = ['월','화','수','목','금','토','일'];
  const week = S.visits.filter(v => v.visit_date >= days[0] && v.visit_date <= days[6]);
  const est = week.filter(v=>v.status!=='취소').reduce((a,v)=>a+estimateFee(v).total,0);
  const cls = t => t === '구강관리' ? 'care' : t === '초진평가' ? 'eval' : '';
  return `
  <div class="page-head"><div><h1>일정 · 방문 배정</h1><p>${days[0]} ~ ${days[6]} · 주간 보기</p></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:6px">
      <button class="btn sm" onclick="weekStart=addDays(weekStart,-7);render()">‹ 이전주</button>
      <button class="btn sm" onclick="weekStart=mondayOf(todayISO());render()">이번주</button>
      <button class="btn sm" onclick="weekStart=addDays(weekStart,7);render()">다음주 ›</button>
    </div>
    ${canEdit()?`<button class="btn primary" onclick="formVisit()">＋ 방문 등록</button>`:''}</div>
  <div class="stack">
    <div class="grid g-kpi">
      ${kpi('주간 방문','건',week.length, `미배정 ${week.filter(v=>v.status==='미배정').length}건`, week.some(v=>v.status==='미배정')?'warn':'good')}
      ${kpi('참여 인력','명',new Set(week.map(v=>v.doctor_id).filter(Boolean)).size,'담당 배정된 인원','good')}
      ${kpi('예상 청구액','원',`약 ${Math.round(est/10000)}만`,'수가 가이드라인 기준 시뮬레이션','warn')}
      ${kpi('완료','건',week.filter(v=>v.status==='완료').length,`예약 ${week.filter(v=>v.status==='예약').length}건 대기`,'good')}
    </div>
    <div class="card">
      <div class="cal">
        ${names.map(n=>`<div class="cal-h">${n}</div>`).join('')}
        ${days.map((d,i)=>{
          const evs = S.visits.filter(v=>v.visit_date===d).sort((a,b)=>(a.visit_time||'').localeCompare(b.visit_time||''));
          return `<div class="cal-d ${d===T?'today':''}">
            <div class="n">${+d.slice(8)}일 <span style="font-weight:500">(${names[i]})</span></div>
            <div class="evs">${evs.map(v=>`<div class="ev ${cls(v.type)}" onclick="showVisit('${v.id}')">
              ${(v.visit_time||'').slice(0,5)} ${esc(patN(v.patient_id))}<br>${v.type} · ${esc(staffN(v.doctor_id))}</div>`).join('')}</div></div>`}).join('')}
      </div>
      <div class="chips" style="margin-top:12px">
        <span class="tag"><span class="dot" style="background:var(--series-1)"></span>방문치료</span>
        <span class="tag"><span class="dot" style="background:var(--series-3)"></span>방문구강관리</span>
        <span class="tag"><span class="dot" style="background:var(--series-2)"></span>초진평가</span></div>
    </div>
    <div class="card"><h3>지역별 루트 제안</h3><div class="sub">같은 날 동일 권역 방문을 묶어 이동시간을 줄입니다</div>
      ${routeCards(days)}</div>
  </div>`;
};
function routeCards(days){
  const rows = days.map(d => {
    const evs = S.visits.filter(v=>v.visit_date===d && v.status!=='취소');
    if (!evs.length) return null;
    const regions = [...new Set(evs.map(v=>v.region).filter(Boolean))];
    return { d, regions, evs };
  }).filter(Boolean);
  if (!rows.length) return '<div class="empty">이번 주 등록된 방문이 없습니다</div>';
  return `<div class="grid g-3">${rows.map(r=>`<div style="border:1px solid var(--border);border-radius:11px;padding:12px">
    <div class="sm muted" style="font-weight:700">${r.d.slice(5)}</div>
    <div style="font-weight:650;margin-top:2px">${r.regions.join(' + ') || '지역 미입력'}</div>
    <div class="sm" style="margin-top:6px">${r.evs.sort((a,b)=>(a.visit_time||'').localeCompare(b.visit_time||''))
      .map(v=>`${esc(patN(v.patient_id))} ${(v.visit_time||'').slice(0,5)}`).join(' → ')}</div>
    <div class="sm muted" style="margin-top:4px">${[...new Set(r.evs.map(v=>staffN(v.doctor_id)))].join('·')} ·
      ${r.regions.length<=1?'동일 권역 · 이동 최소':'권역 2곳 이상 · 분리 배차 검토'}</div></div>`).join('')}</div>`;
}

async function saveVisit(id){
  const pid = val('vf-p'); if (!pid) return toast('환자를 선택하세요');
  const p = byId('patients', pid);
  const row = { patient_id: pid, visit_date: val('vf-d'), visit_time: val('vf-t') || null,
    type: val('vf-type'), status: val('vf-st'), title: val('vf-title'),
    doctor_id: val('vf-doc') || null, assistant_id: val('vf-asst') || null,
    region: p?.region || null, fee_code: val('vf-fee'), oral_care: val('vf-oral') === '1',
    equipment_ids: picked('#vf-eq'), note: val('vf-note') };
  if (id) row.id = id; else { row.safety_checks = {}; row.act_codes = []; row.addon_rate = 0; }
  await save('visits', row); closeDrawer();
}
function estimateFee(v){
  const base = feeOf(v.fee_code)?.amount || 0;
  // 기본 수가가 이미 방문구강관리료면 중복 산정하지 않습니다
  const oral = (v.oral_care && v.fee_code !== 'V-ORAL') ? (feeOf('V-ORAL')?.amount || 0) : 0;
  const acts = (v.act_codes||[]).reduce((a,c)=>a+(feeOf(c)?.amount||0),0);
  const addon = Math.round(base * (v.addon_rate||0));
  return { base, oral, acts, addon, total: base + oral + acts + addon };
}

function calcFee(){
  const out = document.getElementById('c-out'); if (!out) return;
  const base = feeOf(document.getElementById('c-base').value); if (!base) return;
  const isT2 = base.code === 'V-DENT-2';
  const oral = chk('c-oral') ? (feeOf('V-ORAL')?.amount||0) : 0;
  const add = parseFloat(document.getElementById('c-add').value) || 0;
  const rate = parseFloat(document.getElementById('c-rate').value) || 0;
  const acts = isT2 ? [...document.querySelectorAll('#c-acts .chip[aria-pressed="true"]')].reduce((a,b)=>a + (+b.dataset.amt||0), 0) : 0;
  const addAmt = Math.round(base.amount * add);
  const total = base.amount + addAmt + oral + acts;
  const self = Math.round(total * rate), ins = total - self;
  out.innerHTML = `<hr class="sep">
    <div class="tbl-wrap"><table><tbody>
      <tr><td>${esc(base.name)}</td><td class="num">${KRW(base.amount)}</td></tr>
      ${addAmt?`<tr><td>동반 인력 가산 (+${Math.round(add*100)}%)</td><td class="num">${KRW(addAmt)}</td></tr>`:''}
      ${oral?`<tr><td>방문구강관리료</td><td class="num">${KRW(oral)}</td></tr>`:''}
      ${acts?`<tr><td>행위수가 합계</td><td class="num">${KRW(acts)}</td></tr>`:''}
      ${!isT2?`<tr><td class="muted sm" colspan="2">방문치과진료료 1은 포괄수가로 행위수가를 별도 산정하지 않습니다.</td></tr>`:''}
    </tbody></table></div>
    <div style="background:var(--plane);border-radius:12px;padding:14px;margin-top:12px">
      <div class="between"><span class="muted sm" style="font-weight:650">총 진료비</span>
        <strong style="font-size:22px;letter-spacing:-.03em">${KRW(total)}</strong></div>
      <hr class="sep" style="margin:10px 0">
      <div class="between sm"><span class="muted">공단 부담</span><strong>${KRW(ins)}</strong></div>
      <div class="between sm" style="margin-top:4px"><span class="muted">본인 부담 (${Math.round(rate*100)}%)</span>
        <strong style="color:var(--series-1)">${KRW(self)}</strong></div></div>
    <div class="sm muted" style="margin-top:8px">※ 1차 가이드라인 기반 추정치입니다. 확정 고시·산정 횟수 제한·대상자 요건에 따라 실제 청구액은 달라질 수 있습니다.</div>`;
}

  const place = picked('#fa-place')[0] || '재가(자택)';
  const row = { received_at: new Date().toISOString(), channel:'홈페이지',

    region: val('fa-region'),
    note: `[홈페이지 신청]\n대상자: ${pname} / ${val('fa-birth')||'-'}\n거주: ${place}\n희망시간: ${picked('#fa-time').join(', ')||'-'}\n증상: ${subj}`,
    meds_flags: picked('#fa-meds'), status:'신규' };

    const { data, error } = await sb.from('intakes').insert(row).select('ref_code').single();

function scoreCheck(){
  const boxes = [...document.querySelectorAll('#chk input')];
  const s = boxes.filter(b=>b.checked).reduce((a,b)=>a + (+b.dataset.w), 0);
  boxes.forEach(b=>b.closest('.checkitem').classList.toggle('done', b.checked));
  const out = document.getElementById('chk-out');
  if (!s){ out.innerHTML = ''; return; }
  const lvl = s >= 6 ? ['ok','방문진료 대상 가능성이 높습니다','바로 신청하시면 코디네이터가 확인 후 안내드립니다.']
            : s >= 3 ? ['','상담을 통해 확인이 필요합니다','전화 상담에서 거주 형태와 전신상태를 함께 확인합니다.']

  out.innerHTML = `<div class="notice ${lvl[0]}"><div><strong>${lvl[1]}</strong>
    <div style="margin-top:3px;font-weight:500">${lvl[2]}</div></div></div>
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="go('f-apply')">방문 신청하러 가기</button>`;
}

      <div class="field"><label>연락처 뒷 4자리</label><input id="st-tel" inputmode="numeric" maxlength="4" placeholder="9080"
        onkeydown="if(event.key==='Enter')lookupStatus()"></div>
      <button class="btn primary" style="width:100%" onclick="lookupStatus()">조회</button>
      <hr class="sep"><div class="sm muted">접수번호를 잊으셨다면 02-000-0000으로 연락 주세요.</div></div>
    <div class="card" id="st-out"><div class="empty">조회 결과가 여기에 표시됩니다</div></div>
  </div>`;
async function lookupStatus(){
  const ref = val('st-ref'), tel = val('st-tel');
  const out = document.getElementById('st-out');
  if (!ref || !tel) return toast('접수번호와 연락처 뒷 4자리를 입력하세요');
  let r = null;
  if (LIVE){
    const { data } = await sb.rpc('guardian_status', { p_ref: ref, p_tel: tel });
    r = data && data[0];
  } else {
    const i = S.intakes.find(x => x.ref_code === ref && (x.from_tel||'').replace(/\D/g,'').slice(-4) === tel);
    if (i){
      const p = S.patients.find(p => p.guardian_tel === i.from_tel) || null;
      const v = p ? S.visits.filter(v=>v.patient_id===p.id && v.status==='예약').sort((a,b)=>a.visit_date.localeCompare(b.visit_date))[0] : null;
      r = { ref_code:i.ref_code, person_name: p?.name || i.from_name, status:i.status,
            next_date: v?.visit_date, next_time: v?.visit_time, doctor_name: v?staffN(v.doctor_id):null, next_title: v?.title };
    }
  }
  if (!r){ out.innerHTML = `<div class="notice">일치하는 접수 내역이 없습니다. 접수번호와 연락처를 다시 확인해 주세요.</div>`; return; }
  const steps = ['접수','상담','대상자 확정','일정 확정','초진 방문','정기 관리'];
  const idx = { '신규':1, '상담중':2, '대상자 확정':3, '보류':1, '종결':6 }[r.status] || 1;
  const done = r.next_date ? Math.max(idx,4) : idx;
  out.innerHTML = `
    <div class="between"><h3>${esc(r.ref_code)} · ${esc(r.person_name||'')} 어르신</h3>${statusTag(r.status)}</div>
    <div class="track" style="margin-top:16px">${steps.map((t,i)=>`<div class="track-s ${i<done?'done':''}">${t}</div>`).join('')}</div>
    <hr class="sep">
    ${r.next_date ? `<dl class="kv"><dt>다음 방문</dt><dd><strong>${r.next_date} ${(r.next_time||'').slice(0,5)}</strong></dd>
      <dt>담당</dt><dd>${esc(r.doctor_name||'배정 중')}</dd>
      <dt>예정 진료</dt><dd>${esc(r.next_title||'-')}</dd>
      <dt>준비 사항</dt><dd>복용 중인 약 봉투, 최근 혈액검사 결과지(있으실 경우)</dd></dl>`
    : `<div class="notice info">아직 방문 일정이 확정되지 않았습니다. 코디네이터가 곧 연락드립니다.</div>`}`;
}
